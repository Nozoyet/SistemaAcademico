services:

  mysql:
    image: mysql:8.0
    container_name: sistemaacademico-mysql
    restart: always
    environment:
      MYSQL_DATABASE: sistema_academico
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/SistemaAcademico.sql:/docker-entrypoint-initdb.d/SistemaAcademico.sql
 
  backend:
    image: sistemaacademico-backend
    container_name: sistemaacademico-backend
    restart: always
    depends_on:
      - mysql
    ports:
      - "8000:80"
    environment:
      APP_ENV: local
      APP_DEBUG: true
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: sistema_academico
      DB_USERNAME: root
      DB_PASSWORD: root


  frontend:
    image: sistemaacademico-frontend
    container_name: sistemaacademico-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "4173:4173"


volumes:
  mysql_data: